<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Map 3 - Car Ownership Rate</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div id="map"></div>
<div id="legend">
  <div class="legend-title">Car Ownership No Vehicles by Census Tract</div>
  <div class="legend-row">
    <span class="legend-swatch" style="background: #E3BBFC;"></span>
    <span>0% – 5%</span>
  </div>
  <div class="legend-row">
    <span class="legend-swatch" style="background: #BF63F8;"></span>
    <span>6% – 30%</span>
  </div>
  <div class="legend-row">
    <span class="legend-swatch" style="background: #9B0BFB;"></span>
    <span>31% – 49%</span>
  </div>
  <div class="legend-row">
    <span class="legend-swatch" style="background: #63079C;"></span>
    <span>50% – 80.6%</span>
  </div>
  <div class="legend-note">Click a tract to view details.</div>
  <button id="reset" class="reset-btn">Reset Map</button>
</div>
<div class="footer">
  Data: ACS 2024 5-Year Estimates (B08201) (Vehicle Availability). Layer: King County census tracts joined in QGIS.
</div>

<script src="js/map3.js"></script>
</body>
</html>
