<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Map 2 - Median Household Income</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet">
    <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
  
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  <div id="map"></div>

  <div id="legend">
    <div class="legend-title">Median Household Income by Census Tract</div>

    <div class="legend-row">
      <span class="legend-swatch" style="background:#f7fcfd;"></span>
      <span>$17,500 – $93,369</span>
    </div>

    <div class="legend-row">
      <span class="legend-swatch" style="background:#ccece6;"></span>
      <span>$93,369 – $119,877</span>
    </div>

    <div class="legend-row">
      <span class="legend-swatch" style="background:#66c2a4;"></span>
      <span>$119,877 – $140,798</span>
    </div>

    <div class="legend-row">
      <span class="legend-swatch" style="background:#2ca25f;"></span>
      <span>$140,798 – $175,314</span>
    </div>

    <div class="legend-row">
      <span class="legend-swatch" style="background:#006d2c;"></span>
      <span>$175,314 – $250,001+</span>
    </div>

    <div class="legend-note">Click a tract to view details.</div>

    <button id="reset" class="reset-btn">Reset Map</button>
  </div>

  <div class="footer">
    Data: ACS 2024 5-Year Estimates (B19013) (Median Household Income). Layer: King County census tracts joined in QGIS.
  </div>

  <script src="js/map2.js"></script>
</body>
</html>
