<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Map 1 - Transit Stop Density</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div id="map"></div>
<div id="legend">
  <div class="legend-title">Transit Stop Density by Census Tract</div>
  <div class="legend-row">
    <span class="legend-swatch" style="background:#f7fbff;"></span>
    <span>1 – 10 stops</span>
  </div>
  <div class="legend-row">
    <span class="legend-swatch" style="background:#6baed6;"></span>
    <span>11 – 25 stops</span>
  </div>
  <div class="legend-row">
    <span class="legend-swatch" style="background:#3182bd;"></span>
    <span>26 – 50 stops</span>
  </div>
  <div class="legend-row">
    <span class="legend-swatch" style="background:#1361a9;"></span>
    <span>51 – 100 stops</span>
  </div>
  <div class="legend-row">
    <span class="legend-swatch" style="background:#08306b;"></span>
    <span>101 – 280 stops</span>
  </div>
  <div class="legend-note">Click a tract to view details.</div>
</div>
<div class="footer">
  Data: 2020 Seattle Census Tract Boundaries &amp; King County Metro Transit Stops. Stop counts computed via spatial join.
</div>
<script src="js/map1.js"></script>
</body>
</html>
